# Paso a php-fpm (servicio `api`). Todo entra por el front controller de Laravel.
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTP_PROXY "";
fastcgi_pass api:9000;

# SSE: cada trozo sale en cuanto PHP hace flush(); sin búfer ni compresión.
fastcgi_buffering off;
# nginx se queda las X-Accel-* del upstream; la API Node mandaba X-Accel-Buffering al cliente (contrato ai-chat).
fastcgi_pass_header X-Accel-Buffering;
fastcgi_request_buffering on;
gzip off;

# Tiempo máximo entre dos trozos de respuesta, no total.
fastcgi_read_timeout 600s;
