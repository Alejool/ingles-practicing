# Front estático + API en el mismo origen (antes: server/index.mts y netlify.toml).

map $uri $ruta_static_cache {
    ~^/_assets/                          "public, max-age=31536000, immutable";
    ~(/sw\.js|/manifest\.webmanifest)$   "no-cache";
    ~(\.html|/)$                         "no-cache";
    default                              "public, max-age=3600";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # PHP rechaza > 2 MB con su propio JSON; aquí se deja llegar hasta 3 MB.
    client_max_body_size 3m;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        include /etc/nginx/ruta/fastcgi-api.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/ruta/fastcgi-api.conf;
    }

    # `/api` sin barra es del front, como en server/index.mts (`startsWith("/api/")`;
    # lo demás va a serveStatic → index.html). Sin esto nginx respondería 301 a `/api/`.
    location = /api {
        include /etc/nginx/ruta/headers.conf;
        add_header Cache-Control $ruta_static_cache always;
        try_files /index.html =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/ruta/headers.conf;
        add_header Cache-Control $ruta_static_cache always;
    }

    location / {
        include /etc/nginx/ruta/headers.conf;
        add_header Cache-Control $ruta_static_cache always;
        # Una sola página: cualquier ruta desconocida devuelve el shell.
        try_files $uri $uri/index.html /index.html;
    }
}
