; Ajustes de PHP para la API. Se cargan después de los de la imagen.

expose_php = Off

; Las correcciones por stream pueden tardar minutos: sin tope de ejecución.
; El límite entre trozos lo pone nginx (fastcgi_read_timeout).
max_execution_time = 0

; SSE: cada trozo sale en cuanto se hace flush().
output_buffering = Off
implicit_flush = Off
zlib.output_compression = Off

; El cuerpo > 2 MB lo rechaza la app (500 server_error, como hoy);
; PHP y nginx dejan pasar hasta 3 MB para que llegue a ella.
post_max_size = 3M
upload_max_filesize = 3M

; Sin pantallas de error: los errores van al log de fpm (stderr).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Con el código montado en desarrollo hay que ver los cambios sin reiniciar.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
