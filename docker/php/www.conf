; Pool de la API. Se carga después del www.conf de la imagen y lo sobrescribe.

[global]
; Al parar el contenedor, las peticiones en curso (streams) tienen 60 s para acabar.
process_control_timeout = 60s

[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Sin tope por petición: los streams SSE duran lo que dure la respuesta del modelo.
request_terminate_timeout = 0

; Las variables del contenedor (DATABASE_URL, cuotas, claves) llegan a PHP.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
; Sin log de accesos de fpm: lo lleva nginx.
access.log = /dev/null
