# Toda la app en tres contenedores: base, buzón de correo y la app.
#   bash start.sh    →  levanta todo
name: ruta-b1b2

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruta}
      POSTGRES_DB: ${POSTGRES_DB:-ruta}
      # Evita reindexados sorpresa al cambiar de locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Solo local, y en 5433 para no chocar con un PostgreSQL que ya tengas.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruta} -d ${POSTGRES_DB:-ruta}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Buzón de desarrollo: los enlaces mágicos llegan aquí, no a correos reales.
  # En producción cambia MAIL_PROVIDER a resend o postmark y quita este servicio.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # required:false → "docker compose up" funciona aunque no exista .env todavía.
      # Lo normal es usar start.sh, que lo crea con secretos generados.
      - path: .env
        required: false
    environment:
      # Estas tienen prioridad sobre .env: apuntan a los servicios de aquí dentro.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ruta}:${POSTGRES_PASSWORD:-ruta}@db:5432/${POSTGRES_DB:-ruta}}
      DB_DRIVER: pg
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      # Las copias de seguridad se escriben aquí dentro, pero quedan en tu disco:
      # ./backups del proyecto. Ver "bash start.sh backup".
      - ./backups:/app/backups
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  db-data:
